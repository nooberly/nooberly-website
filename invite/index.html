<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Kingdom · Nooberly</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0a0a12; color: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 10px; line-height: 1.25; }
  p  { color: #8e8ea6; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
  .mark {
    width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 22px;
    background: #4CAF50; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #0a0a12;
  }
  a.btn {
    display: block; padding: 15px 20px; border-radius: 27px; text-decoration: none;
    font-size: 16px; font-weight: 600; margin-bottom: 12px;
    background: #4CAF50; color: #0a0a12;
  }
  a.alt { background: transparent; color: #4CAF50; border: 1.5px solid rgba(76,175,80,0.5); }
  .fine { color: #6e6e88; font-size: 12.5px; line-height: 1.6; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <div class="mark">N</div>
  <h1>You've been invited to Nooberly</h1>
  <p>A Kingdom built on real people vouching for real people. Get the app, and the person who invited you is already waiting.</p>

  <a class="btn" id="primary" href="#">Get Nooberly</a>
  <a class="btn alt" id="secondary" href="#">Other platform</a>

  <p class="fine" id="already">Already have the app? Open it and scan their code from Profile → My QR Code.</p>
</main>

<script>
(function () {
  // The invite id is the last path segment: /invite/<uuid>
  var id = (location.pathname.split('/').filter(Boolean).pop() || '').trim();
  var valid = /^[0-9a-fA-F-]{36}$/.test(id);

  var APP_STORE = 'https://apps.apple.com/app/id6779643818';
  // THE REFERRER IS THE WHOLE POINT on Android: Play carries this string through
  // the install, and the app reads it back with the Play Install Referrer API —
  // which is how a person who did not have the app yet still arrives attributed.
  // iOS has no equivalent; that side needs a deferred-deep-link service.
  var PLAY = 'https://play.google.com/store/apps/details?id=com.nooberly.app'
           + (valid ? '&referrer=' + encodeURIComponent('invite=' + id) : '');

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var primary = document.getElementById('primary');
  var secondary = document.getElementById('secondary');

  if (isIOS) {
    primary.href = APP_STORE; primary.textContent = 'Get Nooberly for iPhone';
    secondary.href = PLAY;    secondary.textContent = 'Android instead';
  } else if (isAndroid) {
    primary.href = PLAY;      primary.textContent = 'Get Nooberly for Android';
    secondary.href = APP_STORE; secondary.textContent = 'iPhone instead';
  } else {
    primary.href = APP_STORE;   primary.textContent = 'Download for iPhone';
    secondary.href = PLAY;      secondary.textContent = 'Download for Android';
  }

  // If the app IS installed, the OS intercepts this URL before the page ever
  // loads (App Links / Universal Links). Reaching this script means it is not
  // installed — so never try to force a scheme redirect here: on iOS it throws
  // an ugly "cannot open page" dialog over an otherwise fine landing page.
  if (!valid) {
    document.getElementById('already').textContent =
      'This invite link looks incomplete — ask your friend to send it again.';
  }
})();
</script>
</body>
</html>
